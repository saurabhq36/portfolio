<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="ogbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1226"/>
    </linearGradient>
    <radialGradient id="ogglow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0BCEAF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0BCEAF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogbg)"/>
  <rect width="1200" height="630" fill="url(#ogglow)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- SK Logo block -->
  <rect x="100" y="120" width="120" height="120" rx="24" fill="#0d1226" stroke="#0BCEAF" stroke-width="2" opacity="0.5"/>
  <text x="160" y="208" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="800" fill="#0BCEAF" text-anchor="middle">SK</text>

  <!-- Role label -->
  <text x="100" y="305" font-family="'Inter', sans-serif" font-size="22" font-weight="600" fill="#0BCEAF" letter-spacing="6">BACKEND SOFTWARE ENGINEER</text>

  <!-- Name -->
  <text x="100" y="395" font-family="'Space Grotesk', sans-serif" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-3">Saurabh Kumar</text>

  <!-- Tagline -->
  <text x="100" y="460" font-family="'Inter', sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.6)">Building scalable microservices &amp; serverless</text>
  <text x="100" y="498" font-family="'Inter', sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.6)">architectures on the cloud.</text>

  <!-- Bottom row of tech -->
  <g font-family="'Courier New', monospace" font-size="20" font-weight="600" fill="#0BCEAF">
    <text x="100" y="575">Python</text>
    <text x="220" y="575" fill="rgba(255,255,255,0.3)">·</text>
    <text x="240" y="575">Node.js</text>
    <text x="365" y="575" fill="rgba(255,255,255,0.3)">·</text>
    <text x="385" y="575">AWS</text>
    <text x="450" y="575" fill="rgba(255,255,255,0.3)">·</text>
    <text x="470" y="575">Microservices</text>
    <text x="660" y="575" fill="rgba(255,255,255,0.3)">·</text>
    <text x="680" y="575">Kafka</text>
    <text x="770" y="575" fill="rgba(255,255,255,0.3)">·</text>
    <text x="790" y="575">PostgreSQL</text>
  </g>

  <!-- URL -->
  <text x="1100" y="575" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="end">saurabhkumar.in</text>
</svg>
